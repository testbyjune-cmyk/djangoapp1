{% extends "base.html" %}

{% block title %}공항 계산기 - 홈{% endblock %}

{% block content %}
<div class="p-4 bg-white rounded shadow-sm">
    <h1 class="h3 mb-3">✈ 공항 계산기</h1>
    <p class="text-muted">출국/입국 전 필요한 계산을 한 곳에서 처리하세요.</p>
    <ul class="list-group">
        {% for item in nav_items %}
            {% if item.url_name != "core:home" %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <a href="{% url item.url_name %}">{{ item.label }}</a>
                <span class="badge bg-primary rounded-pill">이용 가능</span>
            </li>
            {% endif %}
        {% endfor %}
    </ul>
</div>
{% endblock %}
