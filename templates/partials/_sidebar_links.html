{% for item in nav_items %}
{% if item.app_label != "core" %}
<a class="nav-link sidebar-link {% if request.resolver_match.view_name == item.url_name %}active{% endif %}"
   href="{% url item.url_name %}" title="{{ item.label }}">
    <span class="sidebar-link-icon">{{ item.icon }}</span>
    <span class="sidebar-link-text">{{ item.label }}</span>
</a>
{% endif %}
{% endfor %}
