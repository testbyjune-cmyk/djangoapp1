<!DOCTYPE html>
{% load static %}
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Claude Tutorial{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f7f9fb; }
        .navbar-brand { font-weight: 600; }
        main { max-width: 860px; }
        code { color: #d6336c; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'core:home' %}">🧠 Claude Tutorial</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                aria-controls="navMenu" aria-expanded="false" aria-label="메뉴 열기/닫기">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                {% for item in nav_items %}
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.view_name == item.url_name %}active fw-bold{% endif %}"
                       href="{% url item.url_name %}">{{ item.label }}</a>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</nav>

<main class="container">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>

<form id="csrf-form" style="display:none">{% csrf_token %}</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function () {
    const csrfToken = document.querySelector('#csrf-form input[name="csrfmiddlewaretoken"]').value;

    document.querySelectorAll("[data-progress-toggle]").forEach((button) => {
        button.addEventListener("click", async () => {
            const appLabel = button.dataset.progressToggle;
            try {
                const response = await fetch("{% url 'core:toggle_progress' %}", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": csrfToken,
                    },
                    body: JSON.stringify({ app_label: appLabel }),
                });
                const data = await response.json();
                const label = button.querySelector(".toggle-label");
                button.classList.toggle("btn-success", data.completed);
                button.classList.toggle("btn-outline-success", !data.completed);
                if (label) label.textContent = data.completed ? "✓ 완료됨" : "완료로 표시";
            } catch (err) {
                /* 네트워크 오류 시 조용히 무시 - 완료 표시는 부가 기능이므로 */
            }
        });
    });
})();
</script>
</body>
</html>
